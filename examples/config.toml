# tui-update configuration.
#
# Read from /etc/tui-update/config.toml first, then
# ~/.config/tui-update/config.toml, with the user file overriding the
# machine-wide one. TUI_UPDATE_* environment variables override both, and
# command line flags override everything.

# Privilege escalation prefix used for actions; "" runs the command directly.
#
# It also covers the restart classifiers, which read other processes' memory
# maps: without it they see only your own processes and the plan says so.
sudo = "sudo -n"

# Path to an Omarchy-style colors.toml. Empty follows the active Omarchy
# theme when present, and falls back to the built-in Tokyo Night palette.
theme = ""

# Every key can also be set in the environment, upper-cased and prefixed:
#   TUI_UPDATE_SUDO="doas"
#   TUI_UPDATE_THEME=/etc/tui/colors.toml
